name: Fix Lockfile

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: rm -rf node_modules package-lock.json
      - run: npm install --legacy-peer-deps
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json